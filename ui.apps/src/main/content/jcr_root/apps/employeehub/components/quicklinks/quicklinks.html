<!--/* Quick Links Component */-->
<div class="eh-section eh-section--sm">
    <h2 class="eh-home-section-title">${properties.sectionTitle || 'Quick Access'}</h2>
    <div class="eh-quicklinks">
        <sly data-sly-list.link="${resource.listChildren}">
            <a href="${link.link @ context='uri'}" class="eh-quicklinks__item">
                <span class="eh-quicklinks__icon">🔗</span>
                <h4>${link.label}</h4>
                <p>${link.description}</p>
            </a>
        </sly>
    </div>
</div>
