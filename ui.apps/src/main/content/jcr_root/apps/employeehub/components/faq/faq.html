<!--/* FAQ Component */-->
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-call="${clientlib.js @ categories='employeehub.faq'}"/>
<div class="eh-faq" data-sly-use.model="com.abc.employeehub.core.models.FAQModel">
    <div class="eh-faq__item" data-sly-repeat.item="${model.faqItems}">
        <div class="eh-faq__question">${item.question}</div>
        <div class="eh-faq__answer">${item.answer @ context='html'}</div>
    </div>
</div>
