<!--/* Department Card Component */-->
<div class="eh-card eh-department-card" data-sly-use.model="com.abc.employeehub.core.models.DepartmentCardModel">
    <div class="${model.bannerClass}">${model.bannerEmoji}</div>
    <div class="eh-department-card__body">
        <h3 class="eh-department-card__name">${model.departmentName}</h3>
        <p class="eh-department-card__manager">Manager: <strong>${model.manager}</strong></p>
        <p class="eh-department-card__count">Team size: <strong>${model.employeeCount}</strong> employees</p>
        <div class="eh-department-card__tags" data-sly-test="${model.tagTitles.size > 0}">
            <span class="eh-tag" data-sly-repeat.tag="${model.tagTitles}">${tag}</span>
        </div>
    </div>
</div>
